name: Орбита 3Б — SQL, авторизация и тестовый APK
run-name: "Орбита 3Б: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_operation || 'verify' }} @ ${{ github.sha }}"

on:
  push:
    branches: [codex/orbita-stage-3b-auth]
    paths:
      - 'apps/orbita_mobile/**'
      - 'supabase/**'
      - 'tools/migrations/**'
      - '.github/workflows/orbita-stage-3b.yml'
      - 'docs/STAGE_3B_API_CHECK.md'
      - 'docs/STAGE_3B_API_SERIES.md'
      - 'docs/SUPABASE_FREE_RELIABILITY.md'
  workflow_dispatch:
    inputs:
      migration_operation:
        description: 'verify — без облака; остальные режимы — только после отдельного допуска'
        type: choice
        options: [verify, preview, apply, inspect]
        default: verify
      approved_sha:
        description: 'Полный согласованный SHA для preview/apply/inspect'
        type: string
        default: ''
      requested_project_ref:
        description: 'Точный подтверждённый Ref, не пароль'
        type: string
        default: ''
      preview_run_id:
        description: 'Для apply: номер успешного preview того же коммита'
        type: string
        default: ''
      backup_sha256:
        description: 'Для apply: подтверждённый хеш сохранённого зашифрованного снимка'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_operation != 'verify' && 'orbita-cloud-migration-single-flight' || format('orbita-stage3b-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.migration_operation != 'verify') }}

jobs:
  cli-safety:
    name: Локальная история миграций и защитные проверки
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Подготовить закреплённый CLI 3.0.0
        run: python3 tools/migrations/install_cli.py "$RUNNER_TEMP/orbita-cli"
      - name: Подготовить локальную PostgreSQL
        run: docker pull postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
      - name: Проверить ограничения без облачных данных
        run: python3 -m unittest discover -s tools/migrations/tests -v
      - name: CLI и история в контейнере без сети
        env:
          ORBITA_SUPABASE_CLI: ${{ runner.temp }}/orbita-cli/supabase
        run: python3 -m unittest discover -s supabase/tests -p test_migration_cli.py -v
      - name: Сохранить только вымышленные результаты
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORBITA-migration-local-tests
          path: build/migration-cli-results.json
          if-no-files-found: error
          retention-days: 14
  sql:
    name: Изолированная PostgreSQL и клиентские роли
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Загрузить закреплённую PostgreSQL
        run: docker pull postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
      - name: SQL и RLS без сети и облачной конфигурации
        shell: bash
        run: |
          mkdir -p build
          python3 -m unittest discover -s supabase/tests -p test_auth_sql.py -v 2>&1 | tee build/stage3b-sql-console.txt
      - name: Сохранить вымышленные результаты SQL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORBITA-3B-local-sql-report
          path: build/stage3b-sql-*
          if-no-files-found: error
          retention-days: 14
  verify-and-build:
    if: github.event_name != 'workflow_dispatch' || inputs.migration_operation == 'verify'
    needs: [sql, cli-safety]
    name: Изоляция, регрессии и защищённая сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/orbita_mobile
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Получить исходники
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Подготовить JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/orbita_mobile/android/**/*.gradle.kts
            apps/orbita_mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Подготовить закреплённый Flutter
        shell: bash
        run: |
          sdk_dir="$RUNNER_TEMP/orbita-flutter"
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$sdk_dir"
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          "$sdk_dir/bin/flutter" precache --android --linux
      - name: Подготовить Android SDK
        shell: bash
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            archive="$RUNNER_TEMP/orbita-android-tools.zip"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip --output "$archive"
            echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  $archive" | sha256sum --check
            mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/orbita-android-tools"
            unzip -q "$archive" -d "$RUNNER_TEMP/orbita-android-tools"
            mv "$RUNNER_TEMP/orbita-android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          flutter config --no-analytics --android-sdk "$ANDROID_HOME"
          (yes || true) | "$sdk_manager" --licenses > /dev/null
          "$sdk_manager" 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Проверить зависимости, формат и анализ
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --fatal-infos --no-pub
      - name: Flutter и конфигурация без внешнего сетевого доступа
        shell: bash
        run: |
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec runuser -u "$1" -- bash "$2" "$3"
          ' _ "$(id -un)" "$PWD/tool/checks_without_cloud.sh" "$(command -v flutter)"
      - name: Проверить компиляцию без подключения к серверу
        run: flutter build apk --debug --no-pub --split-per-abi --target-platform android-arm64
      - name: Проверить Android-службу и разрешения
        working-directory: apps/orbita_mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Проверить целевой проект и подготовить клиентскую конфигурацию
        env:
          SUPABASE_TEST_URL: ${{ vars.SUPABASE_TEST_URL }}
          SUPABASE_TEST_PUBLISHABLE_KEY: ${{ vars.SUPABASE_TEST_PUBLISHABLE_KEY }}
          SUPABASE_TEST_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
          SUPABASE_FORBIDDEN_PROJECT_REF: ${{ vars.SUPABASE_FORBIDDEN_PROJECT_REF }}
        run: dart tool/write_test_config.dart "$RUNNER_TEMP/orbita-stage3b-defines.json"
      - name: Собрать подключённый диагностический APK
        run: flutter build apk --debug --no-pub --split-per-abi --target-platform android-arm64 --dart-define-from-file="$RUNNER_TEMP/orbita-stage3b-defines.json"
      - name: Подготовить APK для владельца
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk dist/ORBITA-0.5.4-auth-preparation.apk
          cp ../../docs/ANDROID_0.5.4_PREPARATION.md dist/INSTALL-ANDROID.md
          cp ../../docs/SUPABASE_FREE_RELIABILITY.md dist/SUPABASE_FREE_RELIABILITY.md
          cp ../../docs/STAGE_3B_APPROVAL_PACKAGE.md dist/STAGE_3B_APPROVAL_PACKAGE.md
          (cd dist && sha256sum ORBITA-0.5.4-auth-preparation.apk > SHA256SUMS.txt)
      - name: Сохранить APK и инструкцию
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ORBITA-0.5.4-auth-preparation-apk
          path: apps/orbita_mobile/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Удалить временную конфигурацию
        if: always()
        run: rm -f -- "$RUNNER_TEMP/orbita-stage3b-defines.json"

  # Этот job не объявляет Environment: здесь видны только Repository/Organization Variables.
  # Cloud jobs используют только закреплённый публичный endpoint: обычная URL Variable
  # намеренно никогда не интерполируется в шаги (иначе ошибочный пароль попал бы в лог).
  migration_entry:
    if: github.event_name == 'workflow_dispatch' && (inputs.migration_operation == 'preview' || inputs.migration_operation == 'apply' || inputs.migration_operation == 'inspect') && vars.ORBITA_REPO_MIGRATIONS_ENABLED == 'true' && github.ref == 'refs/heads/codex/orbita-stage-3b-auth'
    name: Предварительный допуск репозитория — без Environment и секретов
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      repo_enabled: ${{ steps.check.outputs.repo_enabled }}
    steps:
      - name: Получить точный коммит
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Проверить предварительный допуск и отсутствие подмены уровней
        id: check
        env:
          ORBITA_OPERATION: ${{ inputs.migration_operation }}
          ORBITA_REPO_ENABLED: ${{ vars.ORBITA_REPO_MIGRATIONS_ENABLED }}
          ORBITA_REQUEST_SHA: ${{ inputs.approved_sha }}
          ORBITA_OUTSIDE_ENV_ENABLED: ${{ vars.ORBITA_CLOUD_MIGRATIONS_ENABLED }}
          ORBITA_OUTSIDE_ENV_ALLOWED_SHA: ${{ vars.ORBITA_ALLOWED_MIGRATION_SHA }}
        run: python3 tools/migrations/repository_gate.py

  migration-preview:
    if: github.event_name == 'workflow_dispatch' && (inputs.migration_operation == 'preview' || inputs.migration_operation == 'inspect') && vars.ORBITA_REPO_MIGRATIONS_ENABLED == 'true' && needs.migration_entry.outputs.repo_enabled == 'true' && github.ref == 'refs/heads/codex/orbita-stage-3b-auth'
    needs: [sql, cli-safety, migration_entry]
    name: Ручной допуск — preview или проверка состояния
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: orbita-mobile-test-migrations
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Получить точный коммит
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Проверить реальный допуск GitHub до выдачи пароля
        env:
          GH_TOKEN: ${{ github.token }}
          ORBITA_OPERATION: ${{ inputs.migration_operation }}
          ORBITA_REPO_ENABLED: ${{ needs.migration_entry.outputs.repo_enabled }}
          ORBITA_ENV_ENABLED: ${{ vars.ORBITA_CLOUD_MIGRATIONS_ENABLED }}
          ORBITA_REQUEST_SHA: ${{ inputs.approved_sha }}
          ORBITA_ALLOWED_SHA: ${{ vars.ORBITA_ALLOWED_MIGRATION_SHA }}
          ORBITA_EXPECTED_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
          ORBITA_FORBIDDEN_REF: ${{ vars.SUPABASE_FORBIDDEN_PROJECT_REF }}
          ORBITA_REQUEST_REF: ${{ inputs.requested_project_ref }}
          ORBITA_DATABASE_URL: postgresql://postgres.fjqghohhohgvwlmefdmo@aws-0-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=verify-full
        run: python3 tools/migrations/github_gate.py
      - name: Подготовить проверенные инструменты
        run: |
          python3 tools/migrations/install_cli.py "$RUNNER_TEMP/orbita-cli"
          docker pull postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
      - name: Только чтение, зашифрованный снимок и dry-run
        if: inputs.migration_operation == 'preview'
        env:
          PGPASSWORD: ${{ secrets.ORBITA_TEST_DB_PASSWORD }}
          ORBITA_BACKUP_PASSPHRASE: ${{ secrets.ORBITA_BACKUP_PASSPHRASE }}
          ORBITA_DATABASE_URL: postgresql://postgres.fjqghohhohgvwlmefdmo@aws-0-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=verify-full
          ORBITA_DATABASE_CA_PEM: ${{ vars.ORBITA_TEST_DB_CA_PEM }}
        run: python3 tools/migrations/cloud_run.py
      - name: Только проверка состояния без повторного применения
        if: inputs.migration_operation == 'inspect'
        env:
          PGPASSWORD: ${{ secrets.ORBITA_TEST_DB_PASSWORD }}
          ORBITA_DATABASE_URL: postgresql://postgres.fjqghohhohgvwlmefdmo@aws-0-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=verify-full
          ORBITA_DATABASE_CA_PEM: ${{ vars.ORBITA_TEST_DB_CA_PEM }}
        run: python3 tools/migrations/cloud_run.py
      - name: Сохранить безопасный предварительный отчёт
        if: inputs.migration_operation == 'preview'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORBITA-migration-preview-${{ github.run_id }}
          path: build/migration-public/preview.json
          if-no-files-found: error
          retention-days: 14
      - name: Сохранить только зашифрованный снимок
        if: inputs.migration_operation == 'preview'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORBITA-migration-backup-${{ github.run_id }}
          path: build/migration-backup/snapshot.tar.gpg
          if-no-files-found: error
          retention-days: 14

      - name: Сохранить только read-only наблюдение
        if: inputs.migration_operation == 'inspect'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORBITA-migration-inspection-${{ github.run_id }}
          path: build/migration-public/inspection.json
          if-no-files-found: error
          retention-days: 14

  migration-apply:
    if: github.event_name == 'workflow_dispatch' && inputs.migration_operation == 'apply' && vars.ORBITA_REPO_MIGRATIONS_ENABLED == 'true' && needs.migration_entry.outputs.repo_enabled == 'true' && github.ref == 'refs/heads/codex/orbita-stage-3b-auth'
    needs: [sql, cli-safety, migration_entry]
    name: Отдельный ручной допуск — одно применение
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: orbita-mobile-test-migrations
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Получить точный коммит
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Проверить допуск, preview и отсутствие прежнего apply
        env:
          GH_TOKEN: ${{ github.token }}
          ORBITA_OPERATION: apply
          ORBITA_REPO_ENABLED: ${{ needs.migration_entry.outputs.repo_enabled }}
          ORBITA_ENV_ENABLED: ${{ vars.ORBITA_CLOUD_MIGRATIONS_ENABLED }}
          ORBITA_REQUEST_SHA: ${{ inputs.approved_sha }}
          ORBITA_ALLOWED_SHA: ${{ vars.ORBITA_ALLOWED_MIGRATION_SHA }}
          ORBITA_EXPECTED_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
          ORBITA_FORBIDDEN_REF: ${{ vars.SUPABASE_FORBIDDEN_PROJECT_REF }}
          ORBITA_REQUEST_REF: ${{ inputs.requested_project_ref }}
          ORBITA_DATABASE_URL: postgresql://postgres.fjqghohhohgvwlmefdmo@aws-0-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=verify-full
          ORBITA_PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          ORBITA_BACKUP_SHA256: ${{ inputs.backup_sha256 }}
        run: python3 tools/migrations/github_gate.py
      - name: Подготовить проверенные инструменты
        run: |
          python3 tools/migrations/install_cli.py "$RUNNER_TEMP/orbita-cli"
          docker pull postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
      - name: Единственное применение и read-only проверка результата
        env:
          PGPASSWORD: ${{ secrets.ORBITA_TEST_DB_PASSWORD }}
          ORBITA_DATABASE_URL: postgresql://postgres.fjqghohhohgvwlmefdmo@aws-0-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=verify-full
          ORBITA_DATABASE_CA_PEM: ${{ vars.ORBITA_TEST_DB_CA_PEM }}
        run: python3 tools/migrations/cloud_run.py
      - name: Сохранить результат или признак неизвестного исхода
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORBITA-migration-apply-${{ github.run_id }}
          path: build/migration-public/apply.json
          if-no-files-found: ignore
          retention-days: 14
