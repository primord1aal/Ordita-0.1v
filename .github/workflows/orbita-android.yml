name: Орбита — проверка и тестовый APK

on:
  push:
    branches: [codex/orbita-android-foundation]
    paths:
      - 'apps/orbita_mobile/**'
      - '.github/workflows/orbita-android.yml'
      - 'docs/ANDROID_STAGE_2.md'
  pull_request:
    paths:
      - 'apps/orbita_mobile/**'
      - '.github/workflows/orbita-android.yml'
      - 'docs/ANDROID_STAGE_2.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbita-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Проверки и сборка Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/orbita_mobile
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Получить исходники
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Подготовить JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/orbita_mobile/android/**/*.gradle.kts
            apps/orbita_mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Подготовить закреплённый Flutter
        shell: bash
        run: |
          sdk_dir="$RUNNER_TEMP/orbita-flutter"
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$sdk_dir"
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
      - name: Подготовить Android SDK
        shell: bash
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            archive="$RUNNER_TEMP/orbita-android-tools.zip"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip --output "$archive"
            echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  $archive" | sha256sum --check
            mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/orbita-android-tools"
            unzip -q "$archive" -d "$RUNNER_TEMP/orbita-android-tools"
            mv "$RUNNER_TEMP/orbita-android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          flutter config --no-analytics --android-sdk "$ANDROID_HOME"
          (yes || true) | "$sdk_manager" --licenses > /dev/null
          "$sdk_manager" 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          flutter --version
      - name: Проверить зафиксированные зависимости
        run: flutter pub get --enforce-lockfile
      - name: Проверить форматирование
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Выполнить анализ
        run: flutter analyze --fatal-infos
      - name: Проверить поведение Flutter
        run: flutter test --reporter expanded
      - name: Собрать тестовый APK
        run: flutter build apk --debug --no-pub --split-per-abi --target-platform android-arm64
      - name: Проверить Android-службу и разрешения
        working-directory: apps/orbita_mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Подготовить файлы для установки
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk dist/ORBITA-0.5.0-test.apk
          cp ../../docs/ANDROID_STAGE_2.md dist/INSTALL-ANDROID.md
          (cd dist && sha256sum ORBITA-0.5.0-test.apk > SHA256SUMS.txt)
          echo 'Тестовая основа. Реальные заказы и серверный Push не подключены.' >> "$GITHUB_STEP_SUMMARY"
      - name: Сохранить APK и инструкцию
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ORBITA-0.5.0-test-apk
          path: apps/orbita_mobile/dist/
          if-no-files-found: error
          retention-days: 14
