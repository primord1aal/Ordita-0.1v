name: Орбита 0.6.1 — проверки и ARM64 APK
on:
  push:
    branches: [codex/orbita-e2e-test-060]
    paths: ['apps/orbita_mobile/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbita-e2e-060-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sql:
    runs-on: ubuntu-24.04
    container: debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    timeout-minutes: 10
    steps:
      - name: Закреплённая PostgreSQL 17.11 (как в локальных проверках)
        run: |
          apt-get update
          apt-get install --no-install-recommends -y python3 git ca-certificates curl
          curl -fsSL https://deb.debian.org/debian/pool/main/p/postgresql-17/postgresql-17_17.11-0+deb13u1_amd64.deb -o /tmp/postgresql-17.deb
          curl -fsSL https://deb.debian.org/debian/pool/main/p/postgresql-17/postgresql-client-17_17.11-0+deb13u1_amd64.deb -o /tmp/postgresql-client-17.deb
          echo 'd2ce1ddffafa783f9acda4c92c86fc21e8288bff3782d739294f14fa797d7886  /tmp/postgresql-17.deb' | sha256sum --check
          echo '9d8558f8dd57c8e92e218a20698383575d53742ca3f9e7c2b7fe5f246d5216ae  /tmp/postgresql-client-17.deb' | sha256sum --check
          apt-get install --no-install-recommends -y /tmp/postgresql-17.deb /tmp/postgresql-client-17.deb
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Изолированные проверки SQL без облачных данных
        run: |
          mkdir -p /tmp/orbita-dispatch-checks build
          chown postgres:postgres /tmp/orbita-dispatch-checks build
          test_version="$(/usr/lib/postgresql/17/bin/postgres --version)"
          runuser -u postgres -- env TMPDIR=/tmp/orbita-dispatch-checks PYTHONPYCACHEPREFIX=/tmp/orbita-dispatch-checks/pycache ORBITA_ORDERS_PG_BIN=/usr/lib/postgresql/17/bin ORBITA_ORDERS_PG_VERSION="$test_version" python3 -m unittest discover -s supabase/tests -p test_orders_sql.py -v
          runuser -u postgres -- env TMPDIR=/tmp/orbita-dispatch-checks PYTHONPYCACHEPREFIX=/tmp/orbita-dispatch-checks/pycache ORBITA_ORDERS_PG_BIN=/usr/lib/postgresql/17/bin ORBITA_ORDERS_PG_VERSION="$test_version" python3 -m unittest discover -s supabase/tests -p test_dispatch_sql.py -v
          runuser -u postgres -- env TMPDIR=/tmp/orbita-dispatch-checks PYTHONPYCACHEPREFIX=/tmp/orbita-dispatch-checks/pycache ORBITA_ORDERS_PG_BIN=/usr/lib/postgresql/17/bin ORBITA_ORDERS_PG_VERSION="$test_version" python3 -m unittest discover -s supabase/tests -p test_map_budget_sql.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ORBITA-0.6.1-local-sql
          path: build/*-sql-results.json
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/orbita_mobile
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Закреплённый Flutter
        run: |
          sdk_dir="$RUNNER_TEMP/orbita-flutter"
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$sdk_dir"
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          "$sdk_dir/bin/flutter" precache --android --linux
      - name: Android SDK
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            archive="$RUNNER_TEMP/orbita-android-tools.zip"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip --output "$archive"
            echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  $archive" | sha256sum --check
            mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/orbita-android-tools"
            unzip -q "$archive" -d "$RUNNER_TEMP/orbita-android-tools"
            mv "$RUNNER_TEMP/orbita-android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          flutter config --no-analytics --android-sdk "$ANDROID_HOME"
          (yes || true) | "$sdk_manager" --licenses > /dev/null
          "$sdk_manager" 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Proxy request safety tests
        working-directory: .
        run: node --experimental-strip-types --test supabase/functions/orbita-maps/*.test.ts
      - name: Зависимости, формат и анализ
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --fatal-infos --no-pub
      - name: Flutter без внешней сети
        run: |
          sudo unshare --net -- bash -euc '
            ip link set lo up
            exec runuser -u "$1" -- bash "$2" "$3"
          ' _ "$(id -un)" "$PWD/tool/checks_without_cloud.sh" "$(command -v flutter)"
      - name: Проверка компиляции Android
        run: flutter build apk --debug --no-pub --split-per-abi --target-platform android-arm64
      - name: Подготовить проверенные Android-образы для Robolectric
        run: python3 tool/fetch_robolectric.py
      - name: Android unit tests и lint
        working-directory: apps/orbita_mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Сохранить отчёты Android-проверок
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORBITA-0.6.1-android-checks
          path: |
            apps/orbita_mobile/build/app/test-results/testDebugUnitTest/
            apps/orbita_mobile/build/app/reports/tests/testDebugUnitTest/
            apps/orbita_mobile/build/app/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
      - name: Проверка тестовой конфигурации
        env:
          SUPABASE_TEST_URL: ${{ vars.SUPABASE_TEST_URL }}
          SUPABASE_TEST_PUBLISHABLE_KEY: ${{ vars.SUPABASE_TEST_PUBLISHABLE_KEY }}
          SUPABASE_TEST_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
          SUPABASE_FORBIDDEN_PROJECT_REF: ${{ vars.SUPABASE_FORBIDDEN_PROJECT_REF }}
        run: |
          test "$SUPABASE_TEST_PROJECT_REF" = fjqghohhohgvwlmefdmo
          dart tool/write_test_config.dart "$RUNNER_TEMP/orbita-060-defines.json"
      - name: Подключённый ARM64 debug APK
        run: flutter build apk --debug --no-pub --split-per-abi --target-platform android-arm64 --dart-define-from-file="$RUNNER_TEMP/orbita-060-defines.json"
      - name: Установочный пакет
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk dist/ORBITA-0.6.1-test.apk
          cp ../../docs/ORBITA_0.6.1.md dist/INSTALL-ANDROID.md
          (cd dist && sha256sum ORBITA-0.6.1-test.apk > SHA256SUMS.txt)
          echo 'APK собран. Облачная миграция диспетчеризации требует отдельного согласования владельца.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORBITA-0.6.1-test-apk
          path: apps/orbita_mobile/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Удалить временную конфигурацию
        if: always()
        run: rm -f -- "$RUNNER_TEMP/orbita-060-defines.json"
