name: Орбита — отдельный допуск миграции заказов
run-name: "Орбита Orders: регистрация @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, preview, apply, inspect]
        default: verify
        description: 'Сейчас разрешён только локальный verify; облачные режимы требуют отдельного допуска'
      approved_sha:
        type: string
        default: ''
        description: 'Точный согласованный SHA коммита'
      project_ref:
        type: string
        default: ''
        description: 'Только подтверждённый orbita-mobile-test ref'
      preview_run_id:
        type: string
        default: ''
        description: 'Для apply — успешный preview того же SHA'
      backup_sha256:
        type: string
        default: ''
        description: 'Для apply — подтверждённый SHA-256 зашифрованной копии'

permissions: {}

jobs:
  registration-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Остановить выполнение регистрационной версии
        run: |
          echo '::error::This is a registration-only workflow. Select the approved working branch after separate owner authorization.'
          exit 1
